name: Build and Release llama-server

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0-mtp)"
        required: true
        type: string
      llama_ref:
        description: "llama.cpp ref to build (branch, tag, PR ref e.g. pull/22673/head)"
        required: false
        default: "pull/22673/head"
        type: string

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone llama.cpp at specified ref
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git fetch origin "${{ inputs.llama_ref }}:target-ref"
          git checkout target-ref

      - name: Configure (Metal)
        working-directory: llama.cpp
        run: cmake -B build -DGGML_METAL=ON

      - name: Build llama-server
        working-directory: llama.cpp
        run: cmake --build build --config Release --target llama-server -j$(sysctl -n hw.ncpu)

      - name: Verify binary
        working-directory: llama.cpp
        run: ./build/bin/llama-server --version

      - name: Package binary
        working-directory: llama.cpp
        run: |
          mkdir -p release
          cp build/bin/llama-server release/
          cp build/bin/*.metal release/ 2>/dev/null || true
          cp build/bin/*.dylib release/ 2>/dev/null || true

      - name: Fix dylib rpaths
        working-directory: llama.cpp/release
        run: |
          # Replace build-time rpaths with @executable_path so binaries find
          # dylibs in the same directory regardless of where they are extracted.
          for bin in llama-server *.dylib; do
            [ -f "$bin" ] || continue
            # Remove all existing rpaths
            otool -l "$bin" | grep -A2 'cmd LC_RPATH' | grep 'path ' | awk '{print $2}' | while read -r rpath; do
              install_name_tool -delete_rpath "$rpath" "$bin" 2>/dev/null || true
            done
            # Add @executable_path as the rpath
            install_name_tool -add_rpath @executable_path "$bin" 2>/dev/null || true
          done

          # Also fix the install names of dylibs themselves
          for dylib in *.dylib; do
            [ -f "$dylib" ] || continue
            install_name_tool -id "@rpath/$dylib" "$dylib"
          done

      - name: Create archive
        working-directory: llama.cpp
        run: tar -czf llama-server-macos-arm64.tar.gz -C release .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "llama-server ${{ inputs.release_tag }}"
          body: |
            llama-server built from `${{ inputs.llama_ref }}` for macOS ARM64 (Apple Silicon) with Metal.
          files: llama.cpp/llama-server-macos-arm64.tar.gz
          draft: false
          prerelease: false
